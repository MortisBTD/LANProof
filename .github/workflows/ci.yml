name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LANPROOF_UI_QA_DIR: ${{ github.workspace }}/work/ui-preview
      LANPROOF_BENCHMARK_DIR: ${{ github.workspace }}/work/benchmarks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LANProof.sln
      - name: Build
        run: dotnet build LANProof.sln -c Release --no-restore
      - name: Test
        run: dotnet test LANProof.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory work/test-results
      - name: Publish Windows x64
        run: dotnet publish src/LANProof.App -c Release -r win-x64 --self-contained true -o publish/LANProof-Windows-0.1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-evidence
          path: work/
          if-no-files-found: warn
          retention-days: 7
