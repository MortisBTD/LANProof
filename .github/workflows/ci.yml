name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LANPROOF_UI_QA_DIR: ${{ github.workspace }}/work/ui-preview
      LANPROOF_BENCHMARK_DIR: ${{ github.workspace }}/work/benchmarks
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LANProof.sln
      - name: Build
        run: dotnet build LANProof.sln -c Release --no-restore
      - name: Test
        run: dotnet test LANProof.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory work/test-results
      - name: Publish Windows x64
        run: dotnet publish src/LANProof.App -c Release -r win-x64 --self-contained true -o publish/LANProof-Windows-0.1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-evidence
          path: work/
          if-no-files-found: warn
          retention-days: 7
